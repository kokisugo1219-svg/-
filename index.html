<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>SPI言語トレーニング</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
<header class="app-header">
  <h1>SPI言語トレーニング</h1>
  <p class="subtitle">テストセンター対策・言語分野の自主学習アプリ</p>
</header>

<main class="app-main">

  <!-- ホーム画面 -->
  <section id="screen-home" class="screen active">
    <div class="panel">
      <h2>分野を選ぶ</h2>
      <div id="category-grid" class="category-grid"></div>
    </div>

    <div class="panel">
      <h2>問題数を選んで開始</h2>
      <div class="count-buttons">
        <button class="count-btn" data-count="5">5問</button>
        <button class="count-btn" data-count="10">10問</button>
        <button class="count-btn" data-count="20">20問</button>
        <button class="count-btn" data-count="all">全問</button>
      </div>
    </div>

    <div class="panel">
      <h2>苦手問題を復習</h2>
      <p class="hint">直近で間違えた問題だけを出題します。（現在 <span id="weak-count">0</span> 問）</p>
      <button id="review-btn" class="secondary-btn" disabled>苦手問題を復習する</button>
    </div>

    <div class="panel">
      <h2>単語帳で暗記する</h2>
      <p class="hint"><span id="tango-total-count">0</span>語中、<span id="tango-known-count">0</span>語を「覚えた」判定済み</p>
      <div id="tango-category-grid" class="category-grid"></div>
      <label class="checkbox-row">
        <input type="checkbox" id="tango-unknown-only">
        まだ覚えていない語句だけ出題する
      </label>
      <button id="tango-start-btn" class="secondary-btn">単語帳を始める</button>
    </div>

    <div class="panel">
      <button id="reset-btn" class="text-btn">学習記録をリセットする</button>
    </div>
  </section>

  <!-- 単語帳画面 -->
  <section id="screen-tango" class="screen">
    <div class="quiz-header">
      <span class="badge">単語帳</span>
      <span id="tango-progress" class="progress-text"></span>
    </div>
    <div class="progress-bar-outer"><div id="tango-progress-bar" class="progress-bar-inner"></div></div>

    <div id="tango-card" class="tango-card">
      <div class="tango-card-category" id="tango-card-category"></div>
      <div class="tango-card-word" id="tango-card-word"></div>
      <div id="tango-card-back" class="tango-card-back">
        <div class="tango-card-reading" id="tango-card-reading"></div>
        <div class="tango-card-meaning" id="tango-card-meaning"></div>
        <div class="tango-card-example" id="tango-card-example"></div>
      </div>
      <p class="tango-flip-hint" id="tango-flip-hint">タップして意味を表示</p>
    </div>

    <div id="tango-judge-buttons" class="tango-judge-buttons">
      <button id="tango-unknown-btn" class="judge-btn judge-unknown">まだ覚えていない</button>
      <button id="tango-known-btn" class="judge-btn judge-known">覚えた</button>
    </div>

    <button id="tango-home-btn" class="text-btn">ホームに戻る</button>
  </section>

  <!-- クイズ画面 -->
  <section id="screen-quiz" class="screen">
    <div class="quiz-header">
      <span id="quiz-category-label" class="badge"></span>
      <span id="quiz-progress" class="progress-text"></span>
    </div>
    <div class="progress-bar-outer"><div id="quiz-progress-bar" class="progress-bar-inner"></div></div>

    <div class="panel">
      <p id="quiz-instruction" class="instruction"></p>
      <div id="quiz-prompt" class="prompt"></div>
      <div id="quiz-choices" class="choices"></div>
      <button id="dont-know-btn" class="dont-know-btn">わからない（正解を見る）</button>
    </div>

    <div id="explanation-box" class="explanation-box">
      <p id="dont-know-label" class="dont-know-label">「わからない」を選択しました</p>
      <p id="explanation-text"></p>
    </div>

    <button id="next-btn" class="primary-btn">次の問題へ</button>
  </section>

  <!-- 結果画面 -->
  <section id="screen-result" class="screen">
    <div class="panel result-panel">
      <h2>結果</h2>
      <div class="result-score" id="result-score">0 / 0</div>
      <div class="result-rate" id="result-rate">0%</div>
      <p id="result-dontknow" class="hint"></p>
      <div id="result-breakdown" class="result-breakdown"></div>
    </div>
    <button id="retry-btn" class="primary-btn">ホームに戻る</button>
  </section>

</main>

<script src="js/questions.js?v=6"></script>
<script src="js/tango.js?v=6"></script>
<script src="js/app.js?v=6"></script>
</body>
</html>
